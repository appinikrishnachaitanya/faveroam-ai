services:
  - type: web
    name: tastepassport-ai
    runtime: node
    plan: free
    branch: work
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Publish manually after CI passes; configure gated auto-deploy later.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: QLOO_API_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: AGENT_DEBUG
        value: "1"
